---
# Defaults der Rolle manifest_deploy. Pro Repo/Playbook ueberschreiben.

# --- discover_stacks ---
# stacks_root: (PFLICHT) Pfad zum stacks/-Verzeichnis auf dem Zielhost.

# Host-Filter: nur Stacks mit `host: <stack_host>` im Manifest; Manifeste ohne
# `host:` gehoeren zu stack_host_default. Leer = kein Filter (altes Verhalten).
stack_host: ''
stack_host_default: ''

# --- sync_repo ---
# repo_dest: (PFLICHT); repo_url: (PFLICHT nur im git-Modus)
# git  = Zielhost zieht selbst per git (homelab);
# push = Controller schiebt seinen Checkout per git archive (hetzner-vps).
repo_sync_mode: git
repo_branch: main
# push-Modus: irgendein Pfad im Controller-Checkout, zu deployender Ref, und ob
# uncommittete Aenderungen an getrackten Dateien toleriert werden.
repo_src_dir: "{{ playbook_dir }}"
repo_push_ref: HEAD
repo_push_allow_dirty: false
# repo_key_file:     (optional) SSH-Deploy-Key fuer den git-Checkout
# repo_become_user:  (optional) User fuer den git-Checkout (z. B. homelab: simon)

# --- prepare_stacks ---
# env_in_repo=true  -> .env wird in den Stack-Ordner (<stack>/.env) gerendert (homelab).
# env_in_repo=false -> nach services_config_root/<name>/<name>.env (hetzner-vps).
env_in_repo: true
services_config_root: /opt/services-config
# Owner/Group fuer gerenderte Configs/Dirs (homelab: simon, hetzner: root).
config_owner: root
config_group: root
# Verzeichnis der *.j2-Templates. Default: templates/ neben dem aufrufenden Playbook.
# Absoluter Pfad noetig, weil ein Rollen-Task 'templates/…' sonst role-relativ auflaest.
manifest_templates_dir: "{{ playbook_dir }}/templates"

# --- notify_ntfy ---
ntfy_enabled: false
ntfy_user: admin
# ntfy_url, ntfy_password: vom Caller setzen.
