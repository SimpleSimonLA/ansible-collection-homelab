---
# Synchronisiert das Repo auf dem Zielhost auf repo_branch (Default main).
# Aufruf: include_role name=appelshaeuser.stacks.manifest_deploy tasks_from=sync_repo
# Vars: repo_url, repo_dest (Pflicht); repo_branch, repo_key_file, repo_become_user (optional).
#
# repo_branch steuert den auszucheckenden Ref (Default main; Semaphore-Auto-Deploy).
# Fuer kontrollierte Pre-Merge-Testlaeufe eines Feature-Branches per Extra-Var:
#   -e repo_branch=feat/mein-branch
- name: Ensure repository exists on target host
  ansible.builtin.stat:
    path: "{{ repo_dest }}"
  register: manifest_repo_stat

- name: Abort if repository is missing on target host
  ansible.builtin.assert:
    that:
      - manifest_repo_stat.stat.exists
      - manifest_repo_stat.stat.isdir
    fail_msg: >-
      Repository was not found at {{ repo_dest }} on the target host.
      Erst-Provisionierung ausfuehren.

- name: Sync repository to requested version (default main)
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ repo_branch | default('main') }}"
    key_file: "{{ repo_key_file | default(omit) }}"
    accept_hostkey: yes
    update: yes
    force: yes
  become_user: "{{ repo_become_user | default(omit) }}"
